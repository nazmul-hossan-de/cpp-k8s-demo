apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  # Keep two Nginx Pods running.
  replicas: 2
  # This selector must match the labels on the Pod template.
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
# Provide a stable in-cluster endpoint for the web Pods.
metadata:
  name: web
spec:
  selector:
    app: web
  # Route Service port 80 to container port 80.
  ports:
  - port: 80
    targetPort: 80